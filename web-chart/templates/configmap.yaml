apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  index.html: |
    <h1>{{ .Values.message }}</h1>
    <p>Environment: {{ .Values.environment | upper }}</p>
    <p>Release {{ .Release.Name }}, chart {{ .Chart.Version }}, {{ .Values.replicaCount }} replicas</p>